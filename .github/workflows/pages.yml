name: Publish with GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out mirror
        uses: actions/checkout@v6
      - name: Set up Python for website assets
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rea-main.zip
      - name: Install native website asset dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcairo2 fonts-dejavu-core
      - name: Extract complete REA project
        run: unzip -q rea-main.zip -d "$RUNNER_TEMP/rea-source"
      - name: Install website dependencies
        run: python -m pip install -r "$RUNNER_TEMP/rea-source/rea-main/website/requirements.txt"
      - name: Build and check the website
        working-directory: ${{ runner.temp }}/rea-source/rea-main
        run: python scripts/website.py check
      - name: Confirm the generated homepage exists
        run: test -s "$RUNNER_TEMP/rea-source/rea-main/website/_site/index.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/rea-source/rea-main/website/_site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
